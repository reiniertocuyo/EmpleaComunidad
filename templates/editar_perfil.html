{% extends "layout.html" %}
{% block content %}

<h2>Editar Información Básica</h2>
<form id="formPerfil">
    <div>
        <label>Nombre y Apellido:</label><br>
        <input type="text" id="nombre_completo" value="{{ u.nombre_completo or '' }}">
    </div><br>

    <div>
        <label>Descripción profesional:</label><br>
        <textarea id="descripcion">{{ u.descripcion or '' }}</textarea>
    </div><br>
    
    <div>
        <label>Género:</label>
        <select id="genero">
            <option value="Masculino" {{ 'selected' if u.genero == 'Masculino' }}>Masculino</option>
            <option value="Femenino" {{ 'selected' if u.genero == 'Femenino' }}>Femenino</option>
            <option value="Otro" {{ 'selected' if u.genero == 'Otro' }}>Otro</option>
        </select>
    </div><br>
    
    <div>
        <label>Fecha de nacimiento:</label>
        <input type="date" id="fecha_nacimiento" value="{{ u.fecha_nacimiento or '' }}">
    </div><br>
    
    <button type="submit">Actualizar Datos Básicos</button>
</form>

<hr>

<h2>Experiencia Laboral</h2>
<div id="seccionExperiencia">
    <input type="text" id="exp_compania" placeholder="Compañía">
    <input type="text" id="exp_puesto" placeholder="Puesto">
    <input type="number" id="exp_ano" placeholder="Año">
    <button onclick="agregarItem('experiencia')">Añadir Trabajo</button>
</div>

<hr>

<h2>Educación</h2>
<div id="seccionEducacion">
    <input type="text" id="edu_institucion" placeholder="Institución">
    <input type="text" id="edu_nivel" placeholder="Nivel (Ej: Universitario)">
    <input type="number" id="edu_ano" placeholder="Año">
    <button onclick="agregarItem('educacion')">Añadir Educación</button>
</div>

<br>
<a href="{{ url_for('dashboard') }}">Volver al Dashboard</a>

<script>
// Manejo de datos básicos
document.getElementById('formPerfil').onsubmit = async (e) => {
    e.preventDefault();
    const datos = {
        nombre_completo: document.getElementById('nombre_completo').value,
        descripcion: document.getElementById('descripcion').value,
        genero: document.getElementById('genero').value,
        fecha_nacimiento: document.getElementById('fecha_nacimiento').value
    };

    const resp = await fetch('/perfil/editar', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(datos)
    });
    
    if(resp.ok) alert("Datos básicos guardados");
};

// Función genérica para añadir Experiencia o Educación
async function agregarItem(tipo) {
    let payload = {};
    let url = '';

    if (tipo === 'experiencia') {
        url = '/perfil/agregar_experiencia';
        payload = {
            compania: document.getElementById('exp_compania').value,
            puesto: document.getElementById('exp_puesto').value,
            ano: document.getElementById('exp_ano').value
        };
    } else {
        url = '/perfil/agregar_educacion';
        payload = {
            institucion: document.getElementById('edu_institucion').value,
            nivel: document.getElementById('edu_nivel').value,
            ano: document.getElementById('edu_ano').value
        };
    }

    const resp = await fetch(url, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });

    if (resp.ok) {
        alert("Agregado con éxito");
        location.reload(); // Recargamos para limpiar campos y mostrar que se guardó
    }
}
</script>
{% endblock %}
