{% extends "layout.html" %}
{% block content %}

<div>
    <h2>Configuración de Perfil Corporativo</h2>
    
    <form action="/perfil/editar" method="POST" enctype="multipart/form-data" >
        <div >
            <label>Logo de la Empresa:</label><br>
            <input type="file" name="foto" accept="image/*" >
        </div>

        <div >
            <label>Nombre de la Empresa:</label><br>
            <input type="text" name="nombre_completo" value="{{ u.nombre_completo or '' }}" required >
        </div>

        <div class="form-group">
            <label>Nombre del Administrador:</label><br>
            <input type="text" name="nombre_administrador" value="{{ u.nombre_administrador or '' }}">
        </div>

        <div >
            <label>Descripción de la Empresa / Slogan:</label><br>
            <textarea name="descripcion" rows="5" >{{ u.descripcion or '' }}</textarea>
        </div>

        <button type="submit" >
            Guardar Cambios Principales
        </button>
    </form>

    <hr style="margin: 40px 0;">

    <h3>Gestión de Contactos y Enlaces</h3>
    <div id="lista-contactos" >
        {% for c in contactos %}
        <div >
            <span><strong>{{ c.tipo_contacto }}:</strong> {{ c.valor }}</span>
            <button onclick="eliminarContacto({{ c.id }})" >Eliminar</button>
        </div>
        {% endfor %}
    </div>

    <div >
        <h4>Añadir nuevo contacto:</h4>
        <div >
            <select id="nuevo_tipo" >
                <option value="Web">Sitio Web</option>
                <option value="LinkedIn">LinkedIn</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="Email Corporativo">Email Corporativo</option>
                <option value="Teléfono">Teléfono</option>
            </select>
            <input type="text" id="nuevo_valor" placeholder="URL o número" >
            <button onclick="agregarContacto()" >
                Añadir
            </button>
        </div>
    </div>

    <br>
    <a href="{{ url_for('dashboard') }}" >← Volver al Panel</a>
</div>

<script>
async function agregarContacto() {
    const valor = document.getElementById('nuevo_valor').value;
    if (!valor) return alert("Escribe un valor");

    const payload = {
        tipo_contacto: document.getElementById('nuevo_tipo').value,
        valor: valor
    };

    const resp = await fetch('/perfil/agregar_contacto', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    });

    if (resp.ok) {
        location.reload();
    } else {
        alert("Error al añadir contacto");
    }
}

async function eliminarContacto(id) {
    if (!confirm("¿Eliminar este contacto?")) return;
    
    const resp = await fetch(`/perfil/eliminar/contacto/${id}`, {
        method: 'POST'
    });

    if (resp.ok) {
        location.reload();
    } else {
        alert("Error al eliminar");
    }
}
</script>

{% endblock %}
