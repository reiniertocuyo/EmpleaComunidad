{% extends "layout.html" %}

{% block content %}
    <h1>Crear Cuenta</h1>
    
    <form id="formRegistro" action="/registro" method="POST">
        
        <!-- NUEVO: Selector de Tipo de Cuenta -->
        <div class="grupo-formulario">
            <label><strong>Tipo de cuenta:</strong></label>
            
            <div class="contenedor-tipo-cuenta">
                <!-- Opción Personal -->
                <input type="radio" name="tipo" value="persona" id="tipo_persona" checked>
                <label for="tipo_persona" class="tarjeta-radio">
                    <span class="icono">👤</span>
                    <div class="texto-radio">
                        <strong>Personal</strong>
                        <p>Busco empleo</p>
                    </div>
                </label>
                
                <!-- Opción Empresa -->
                <input type="radio" name="tipo" value="empresa" id="tipo_empresa">
                <label for="tipo_empresa" class="tarjeta-radio">
                    <span class="icono">🏢</span>
                    <div class="texto-radio">
                        <strong>Empresa</strong>
                        <p>Busco talento</p>
                    </div>
                </label>
            </div>
        </div>

        <label>Nombre de usuario:</label><br>
        <input type="text" name="usuario" id="usuario" required>
        <span id="errorUsuario" style="color: red; font-size: 0.8em; display: block;"></span>
        <br>

        <label>Correo electrónico:</label><br>
        <input type="email" name="email" id="email" required>
        <span id="errorEmail" style="color: red; font-size: 0.8em; display: block;"></span>
        <br>

        <label>Elige una contraseña:</label><br>
        <input type="password" name="password" id="password" required>
        <br><br>

        <label>Confirma tu contraseña:</label><br>
        <input type="password" name="confirm_password" id="confirm_password" required>
        <span id="errorPassword" style="color: red; font-size: 0.8em; display: block;"></span>
        <br>

        <button type="submit">Registrarme</button>
    </form>

    <script src="{{ url_for('static', filename='js/registro.js') }}"></script>
{% endblock %}
